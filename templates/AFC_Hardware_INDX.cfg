#--=================================================================================--#
######### Bondtech INDX ###############################################################
#--=================================================================================--#
# INDX passive tools all share the Smart Head's single [extruder]. Each tool is an
# [AFC_extruder] with `extruder_name: extruder` and its INDX dock number in `tool_index`.
# Tool changes are done by the INDX macros installed in AFC/indx/. Dock positions, tool
# count and the other INDX settings live in AFC/indx/indx.cfg.
#
# The Smart Head itself ([mcu indxmcu], [indx], [extruder], [load_cell_probe] ...) is
# configured in printer.cfg as described in the INDX README.

[force_move]
enable_force_move: True

# INDX keeps the tool on the head, latch state and tool offsets here. If printer.cfg already
# has a [save_variables] section, the installer removes this one and INDX uses yours.
[save_variables]
filename: ~/printer_data/config/indx_vars.cfg

[respond]

[include indx/indx.cfg]
[include indx/indx-tc-macros.cfg]
[include indx/indx-cal.cfg]
# Only one [homing_override] can exist. If you already have one, merge the INDX sequence
# from indx/homing.cfg into yours and leave this commented out.
[include indx/homing.cfg]

#[filament_switch_sensor bypass]
#switch_pin: YOUR_BYPASS_PIN
#pause_on_runout: False

[AFC_Toolchanger INDX]
backend: indx
# Names of the INDX macros AFC calls. Only set these if you renamed the macros.
#indx_change_macro: INDX_CHANGE_TOOL
#indx_park_macro: PARK_TOOL
#indx_positions_macro: TOOL_POSITIONS

# One section per installed tool. tool_index is the INDX tool number (t<n>_x/t<n>_dock_y in
# indx.cfg), map is the T command the slicer sends for it. To change the number of tools run
#   ~/AFC-Klipper-Add-On/utilities/indx_tools.py set-count <n>
# (or "Set INDX tool count" in the install script's utilities menu). It keeps these sections,
# tool_count and the T<n> wrappers in indx.cfg in step.
#
# pin_tool_start: virtual adds a switch per tool in Mainsail/Fluidd to mark the tool loaded,
# passive tools have no sensors. standalone_auto_load_unload stays off since the DX extruder can
# only feed a tool while it is on the head; use LOAD_FILAMENT TOOL=<n> TYPE=<material> instead.
#
# led_name is left unset: all tools share the Smart Head neopixel, so per tool status colors
# would overwrite each other.

[AFC_extruder tool0]
extruder_name: extruder
tool_index: 0
map: T0
toolchanger_unit: INDX
pin_tool_start: virtual
standalone_auto_load_unload: False
tool_stn: 72
tool_stn_unload: 100

[AFC_extruder tool1]
extruder_name: extruder
tool_index: 1
map: T1
toolchanger_unit: INDX
pin_tool_start: virtual
standalone_auto_load_unload: False
tool_stn: 72
tool_stn_unload: 100

[AFC_extruder tool2]
extruder_name: extruder
tool_index: 2
map: T2
toolchanger_unit: INDX
pin_tool_start: virtual
standalone_auto_load_unload: False
tool_stn: 72
tool_stn_unload: 100
