# Klipper + AFC configuration with a Bondtech INDX toolchanger fed by a BoxTurtle in a mixed
# layout: lanes 1-2 through hub_t0 to tool0 (N:1), lane 3 direct to tool1 (1:1) and tool2
# standalone. Each lane-fed path has its own TurtleNeck-style buffer used as pin_tool_start.
# Based on afc_indx.cfg.
# and the vendored INDX macros. Based on afc_base.cfg.
# Uses a simulated STM32H723 MCU (via test/dict/stm32h723.dict).
#
# Pin naming uses STM32H723 port/pin notation (e.g. PA0, PB1, …)
# matching the AFC Lite board (config/mcu/AFC_Lite.cfg).

# ---------------------------------------------------------------------------
# MCU: path is irrelevant in dict/simulation mode
# ---------------------------------------------------------------------------
[mcu]
serial: /dev/null

# ---------------------------------------------------------------------------
# Printer kinematics (required by Klipper)
# ---------------------------------------------------------------------------
[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: PA0
dir_pin: PA1
enable_pin: !PA2
microsteps: 16
rotation_distance: 40
endstop_pin: PA3
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PA4
dir_pin: PA5
enable_pin: !PA6
microsteps: 16
rotation_distance: 40
endstop_pin: PA7
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PB0
dir_pin: PB1
enable_pin: !PB2
microsteps: 16
rotation_distance: 8
endstop_pin: PB3
position_endstop: 0
position_max: 200

[extruder]
step_pin: PB4
dir_pin: PB5
enable_pin: !PB6
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB7
sensor_type: temperature_host
min_temp: 0
max_temp: 250
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114

[heater_bed]
heater_pin: PB8
sensor_type: temperature_host
min_temp: 0
max_temp: 130
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182

# save_variables is required by AFC to persist spool/lane state.
[save_variables]
filename: /tmp/afc_klippy_indx_lanes_test.cfg

[respond]

# pause_resume is required by AFC_error
[pause_resume]

# ---------------------------------------------------------------------------
# AFC core modules (no hardware units, simplest possible AFC config)
# ---------------------------------------------------------------------------

# The [testing] section activates the klippy_testing_plugin (ASSERT command).
[testing]

[AFC]
VarFile: /tmp/afc_klippy_indx_lanes_test.var
long_moves_speed: 150
long_moves_accel: 250
short_moves_speed: 50
short_moves_accel: 300
short_move_dis: 10
enable_sensors_in_gui: False
load_to_hub: False
z_hop: 5
resume_speed: 120
resume_z_speed: 30
error_timeout: 36000
# LED omitted, keeping config minimal for testing.
tool_cut: False
park: False
poop: False
kick: False
wipe: False
form_tip: False

[AFC_prep]
# PREP needs moonraker for extruder stats, so it can not run here. T(n) map handling is
# covered by unit tests.
enable: False

[AFC_form_tip]
cooling_tube_position: 35
cooling_tube_length: 10
cooling_moves: 4

# ---------------------------------------------------------------------------
# Bondtech INDX
# ---------------------------------------------------------------------------
# Stand in for the INDX load cell probe, indx-cal.cfg renames Z_OFFSET_APPLY_PROBE
[probe]
pin: PC6
z_offset: 0

[include ../../templates/indx_macros/indx.cfg]
[include ../../templates/indx_macros/indx-tc-macros.cfg]
[include ../../templates/indx_macros/indx-cal.cfg]
[include ../../templates/indx_macros/homing.cfg]

[AFC_Toolchanger INDX]
backend: indx

[AFC_extruder tool0]
extruder_name: extruder
tool_index: 0
toolchanger_unit: INDX
pin_tool_start: buffer
buffer: buf_t0
form_tip: True

[AFC_extruder tool1]
extruder_name: extruder
tool_index: 1
toolchanger_unit: INDX
pin_tool_start: buffer
buffer: buf_t1

[AFC_extruder tool2]
extruder_name: extruder
tool_index: 2
map: T2
toolchanger_unit: INDX
pin_tool_start: virtual
standalone_auto_load_unload: False

# ---------------------------------------------------------------------------
# BoxTurtle feeding tool0 (lanes 1-2 through hub_t0) and tool1 (lane 3 direct)
# ---------------------------------------------------------------------------
[AFC_BoxTurtle Turtle_1]
hub: hub_t0
extruder: tool0

[AFC_hub hub_t0]
switch_pin: PE0
afc_bowden_length: 900
move_dis: 75
cut: False

[AFC_buffer buf_t0]
advance_pin: PE1
trailing_pin: PE2
multiplier_high: 1.05
multiplier_low: 0.95

[AFC_buffer buf_t1]
advance_pin: PE3
trailing_pin: PE4
multiplier_high: 1.05
multiplier_low: 0.95

[AFC_stepper lane1]
unit: Turtle_1:1
step_pin: PD0
dir_pin: PD1
enable_pin: !PD2
microsteps: 16
rotation_distance: 4.65
dist_hub: 155.0
park_dist: 10
prep: PD3
load: PD4
map: T0

[AFC_stepper lane2]
unit: Turtle_1:2
step_pin: PD5
dir_pin: PD6
enable_pin: !PD7
microsteps: 16
rotation_distance: 4.65
dist_hub: 155.0
park_dist: 10
prep: PD8
load: PD9
map: T1

[AFC_stepper lane3]
unit: Turtle_1:3
step_pin: PD10
dir_pin: PD11
enable_pin: !PD12
microsteps: 16
rotation_distance: 4.65
dist_hub: 1050.0
park_dist: 10
prep: PD13
load: PD14
hub: direct
extruder: tool1
map: T3
